[project]
name = "hack_apertus_coffee_exe"
version = "0.1.0"
description = "A short description of the project."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Abirahm Vasanthakumar", email = "abirahm.vasanthakumar@uzh.ch" },
]
# Runtime dependencies come from requirements.txt (single source of truth).
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hack_apertus_coffee_exe", "hack_apertus_coffee_exe.crawl", "crawl", "triage"]
package-dir = { "hack_apertus_coffee_exe" = "src/hack_apertus_coffee_exe", "crawl" = "src/crawl", "triage" = "triage" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Network tests hit the real websites; run them with: pytest -m integration
markers = ["integration: needs network access to external websites"]
addopts = "-m 'not integration'"
