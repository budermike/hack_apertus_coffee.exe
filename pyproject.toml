[project]
name = "hack_apertus_coffee_exe"
version = "0.1.0"
description = "Finds Federal Supreme Court judgements relevant to Suva and summarises them in German and French with Apertus v1.5."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Abirahm Vasanthakumar", email = "abirahm.vasanthakumar@uzh.ch" },
]
# Runtime dependencies come from requirements.txt (single source of truth).
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The project name "hack_apertus_coffee.exe" is not a valid Python identifier,
# so the source folder and import name are "hack_apertus_coffee_exe".
packages = [
    "hack_apertus_coffee_exe",
    "hack_apertus_coffee_exe.triage",
    "hack_apertus_coffee_exe.crawl",
    "hack_apertus_coffee_exe.summary",
    "hack_apertus_coffee_exe.eval",
    "hack_apertus_coffee_exe.present",
]
package-dir = { "hack_apertus_coffee_exe" = "src/hack_apertus_coffee_exe" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ without installing it
pythonpath = ["src"]
# Network tests hit the real websites; run them with: pytest -m integration
markers = ["integration: needs network access to external websites"]
addopts = "-m 'not integration'"
