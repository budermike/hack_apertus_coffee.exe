<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urteilsradar</title>
    <link rel="stylesheet" href="style.css">
    <script>
        /* set theme before first paint to avoid a flash; light is the default */
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
    </script>
    <script src="i18n.js" defer></script>
    <script src="datepicker.js" defer></script>
    <script src="splitter.js" defer></script>
    <script src="mock.js" defer></script>
    <script src="api.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="appbar">
        <div class="top">
            <h1 data-i18n="appTitle">Urteilsradar</h1>
            <span id="mock-badge" class="tag warn" hidden data-i18n="mockBadge" data-i18n-attr="title:mockBadgeHint">Demo-Daten</span>
            <div class="lang-switch" role="group" data-i18n-attr="aria-label:language">
                <button type="button" data-lang="de">DE</button><button type="button" data-lang="fr">FR</button>
            </div>
            <button id="theme-toggle" type="button" class="theme-toggle" data-i18n-attr="aria-label:toggleTheme;title:toggleTheme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
        <nav class="tabs" role="tablist">
            <button id="tab-search" type="button" role="tab" data-tab="search" aria-controls="panel-search" data-i18n="tabSearch">Urteile</button>
            <button id="tab-kb" type="button" role="tab" data-tab="kb" aria-controls="panel-kb">
                <span data-i18n="tabKb">Datenbank</span>
                <span id="kb-tab-count" class="tab-count" hidden></span>
            </button>
        </nav>
    </header>

    <main>
        <!-- Urteile: search bar on top, results below; a selected case opens next to the list -->
        <div id="panel-search" class="view" role="tabpanel" aria-labelledby="tab-search">
            <div class="searchbar">
                <form id="search-form" class="searchbar-group" novalidate>
                    <label for="date-from" data-i18n="from">Von</label>
                    <div class="date-input">
                        <input id="date-from" type="text" inputmode="numeric" autocomplete="off"
                               data-i18n-attr="placeholder:datePlaceholder">
                        <button type="button" class="icon-btn calendar-btn" data-target="date-from" data-i18n-attr="aria-label:openCalendar">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        </button>
                    </div>
                    <label for="date-to" data-i18n="to">Bis</label>
                    <div class="date-input">
                        <input id="date-to" type="text" inputmode="numeric" autocomplete="off"
                               data-i18n-attr="placeholder:datePlaceholder">
                        <button type="button" class="icon-btn calendar-btn" data-target="date-to" data-i18n-attr="aria-label:openCalendar">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        </button>
                    </div>
                    <button id="search-btn" type="submit" class="btn pri">
                        <span class="spinner" aria-hidden="true"></span>
                        <span data-i18n="search">Suchen</span>
                    </button>
                    <button id="quick-range-btn" type="button" class="btn small" hidden></button>
                </form>
                <p id="form-error" class="form-error" role="alert"></p>
            </div>

            <div id="split" class="split">
                <section class="listpane">
                    <div id="filter-bar" class="filters" hidden>
                        <input id="filter-text" type="search" autocomplete="off"
                               data-i18n-attr="placeholder:filterText;aria-label:filterText">
                        <div id="filter-level" class="seg" role="group" data-i18n-attr="aria-label:filterLevel"></div>
                        <span class="filter-label" data-i18n="relevance">Relevanz</span>
                        <input id="filter-min" type="text" class="num" inputmode="numeric" maxlength="3" autocomplete="off" value="0"
                               data-i18n-attr="aria-label:filterMin">
                        <span class="sub" aria-hidden="true">–</span>
                        <input id="filter-max" type="text" class="num" inputmode="numeric" maxlength="3" autocomplete="off" value="100"
                               data-i18n-attr="aria-label:filterMax">
                        <button id="filter-reset" type="button" class="btn" data-i18n="resetFilters">Zurücksetzen</button>
                        <span id="results-count" class="sub results-count"></span>
                    </div>
                    <div class="scroll">
                        <table id="results-table" hidden>
                            <thead><tr id="results-head"></tr></thead>
                            <tbody id="results-rows"></tbody>
                        </table>
                        <div id="results-status" class="empty"></div>
                    </div>
                </section>
                <!-- drag (or arrow keys) to change the detail width; double-click: default -->
                <div id="split-handle" class="split-handle" role="separator" aria-orientation="vertical"
                     aria-controls="detail-pane" tabindex="0" hidden
                     data-i18n-attr="aria-label:resizeDetail;title:resizeDetail"></div>
                <section id="detail-pane" class="detailpane scroll" hidden>
                    <article id="detail" class="detail"></article>
                </section>
            </div>
        </div>

        <!-- Datenbank: all stored summaries -->
        <div id="panel-kb" class="view scroll" role="tabpanel" aria-labelledby="tab-kb" hidden>
            <div class="page">
                <h2 data-i18n="kbTitle">Datenbank</h2>
                <p class="note" data-i18n="kbIntro"></p>
                <div class="filters kb-toolbar">
                    <input id="kb-search" type="search" autocomplete="off"
                           data-i18n-attr="placeholder:kbSearchPlaceholder;aria-label:kbSearchPlaceholder">
                    <span id="kb-count" class="sub results-count"></span>
                    <!-- mock mode only (development): the real database keeps every version -->
                    <button id="kb-clear" type="button" class="btn" hidden data-i18n="clearDb">Datenbank leeren (temporär)</button>
                </div>
                <p id="kb-status" class="empty"></p>
                <ul id="kb-list" class="kb-list"></ul>
            </div>
        </div>
    </main>

    <dialog id="align-dialog" class="modal" aria-labelledby="align-title">
        <div class="modal-card">
            <h3 id="align-title"></h3>
            <p id="align-desc" class="note"></p>
            <p id="align-status" class="note loading-line" hidden></p>
            <div class="row editor-footer modal-actions">
                <button id="align-apply" type="button" class="btn pri"></button>
                <button id="align-keep" type="button" class="btn"></button>
                <button id="align-cancel" type="button" class="btn" data-i18n="cancel">Abbrechen</button>
            </div>
        </div>
    </dialog>

    <div id="toast" role="status"></div>
</body>
</html>
