<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urteils-Radar</title>
    <link rel="stylesheet" href="style.css">
    <script>
        /* set theme before first paint to avoid a flash; light is the default */
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
    </script>
    <script src="i18n.js" defer></script>
    <script src="datepicker.js" defer></script>
    <script src="api.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">§</span>
            <div>
                <h1 data-i18n="appTitle">Urteils-Radar</h1>
                <p class="subtitle" data-i18n="appSubtitle"></p>
            </div>
        </div>
        <div class="topbar-controls">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="de">DE</button>
                <button type="button" data-lang="fr">FR</button>
            </div>
            <button id="theme-toggle" type="button" class="icon-btn theme-toggle" data-i18n-attr="aria-label:toggleTheme;title:toggleTheme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <main>
        <nav class="folder-tabs" role="tablist">
            <button id="tab-search" type="button" class="folder-tab" role="tab" data-tab="search" aria-controls="panel-search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
                <span data-i18n="tabSearch">Suche</span>
            </button>
            <button id="tab-kb" type="button" class="folder-tab" role="tab" data-tab="kb" aria-controls="panel-kb">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
                <span data-i18n="tabKb">Wissensdatenbank</span>
                <span id="kb-tab-count" class="tab-count" hidden></span>
            </button>
        </nav>

        <div id="panel-search" class="folder" role="tabpanel" aria-labelledby="tab-search">
        <section class="card search-card">
            <h2 data-i18n="searchTitle">Zeitraum</h2>
            <form id="search-form" novalidate>
                <div class="field">
                    <label for="date-from" data-i18n="from">Von</label>
                    <div class="date-input">
                        <input id="date-from" type="text" inputmode="numeric" autocomplete="off"
                               data-i18n-attr="placeholder:datePlaceholder">
                        <button type="button" class="icon-btn calendar-btn" data-target="date-from" data-i18n-attr="aria-label:openCalendar">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label for="date-to" data-i18n="to">Bis</label>
                    <div class="date-input">
                        <input id="date-to" type="text" inputmode="numeric" autocomplete="off"
                               data-i18n-attr="placeholder:datePlaceholder">
                        <button type="button" class="icon-btn calendar-btn" data-target="date-to" data-i18n-attr="aria-label:openCalendar">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        </button>
                    </div>
                </div>
                <button id="search-btn" type="submit" class="primary-btn">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="label" data-i18n="search">Suchen</span>
                </button>
            </form>
            <p id="form-error" class="form-error" role="alert"></p>
        </section>

        <section class="results">
            <div class="results-header">
                <div class="results-title">
                    <h2 data-i18n="resultsTitle">Ergebnisse</h2>
                    <span id="results-count" class="muted"></span>
                </div>
                <div id="selection-toolbar" class="selection-toolbar" hidden>
                    <label class="checkbox-label">
                        <input id="select-all" type="checkbox">
                        <span data-i18n="selectAll">Alle auswählen</span>
                    </label>
                    <button id="summarize-selected" type="button" class="primary-btn small" disabled></button>
                </div>
            </div>
            <div id="filter-bar" class="filter-bar card" hidden>
                <input id="filter-text" type="search" class="text-input" autocomplete="off"
                       data-i18n-attr="placeholder:filterText;aria-label:filterText">
                <div class="score-filter">
                    <span class="filter-label" data-i18n="relevance">Relevanz</span>
                    <input id="filter-min" type="number" class="text-input num" min="0" max="100" step="1" value="0"
                           data-i18n-attr="aria-label:filterMin">
                    <span class="muted" aria-hidden="true">–</span>
                    <input id="filter-max" type="number" class="text-input num" min="0" max="100" step="1" value="100"
                           data-i18n-attr="aria-label:filterMax">
                </div>
                <button id="filter-reset" type="button" class="secondary-btn" data-i18n="resetFilters">Zurücksetzen</button>
            </div>
            <p id="results-status" class="status muted" data-i18n="emptyInitial"></p>
            <ol id="results-list" class="results-list"></ol>
        </section>
        </div>

        <div id="panel-kb" class="folder" role="tabpanel" aria-labelledby="tab-kb" hidden>
        <section class="card kb-card">
            <div class="results-header">
                <div class="results-title">
                    <h2 data-i18n="kbTitle">Wissensdatenbank</h2>
                    <span id="kb-count" class="muted"></span>
                </div>
            </div>
            <div class="kb-toolbar">
                <input id="kb-search" type="search" class="text-input" autocomplete="off"
                       data-i18n-attr="placeholder:kbSearchPlaceholder;aria-label:kbSearchPlaceholder">
                <!-- TEMPORARY (development): remove together with clearDatabase() in api.js -->
                <button id="kb-clear" type="button" class="secondary-btn" data-i18n="clearDb">Datenbank leeren (temporär)</button>
            </div>
            <p id="kb-status" class="muted kb-status"></p>
            <ul id="kb-list" class="kb-list"></ul>
        </section>
        </div>
    </main>

    <footer class="muted" data-i18n="footer"></footer>
</body>
</html>
